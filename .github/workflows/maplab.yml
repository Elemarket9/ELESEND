name: Map lab
on:
  push:
    branches: ['audit/map-lab']
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '24'}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: {distribution: temurin, java-version: '21'}
      - run: bash scripts/maplab/run.sh
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q && git config user.email a@example.com && git config user.name lab && git add -A && git commit -qm lab
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/audit/map-shots
