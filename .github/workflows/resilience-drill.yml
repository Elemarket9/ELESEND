# Starts the production database setup, loads it, then destroys it and recovers from the offsite copies.
# Runs whenever backup, deploy or database files change, and on demand.
name: Backup and restore drill
on:
  workflow_dispatch:
  push:
    paths: ['deploy/runtime/**', 'database/migrations/**', 'scripts/migrate.mjs', 'scripts/prelaunch-*.mjs', 'scripts/ci/resilience-drill.sh', '.github/workflows/resilience-drill.yml']
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELESEND_ENV_FILE: .env.runtime
      OFFSITE_RCLONE_REMOTE: /tmp/offsite
      GPG_PASSPHRASE_FILE: /tmp/backup.passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Tools and settings
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone >/dev/null
          npm ci --ignore-scripts --no-audit --no-fund
          head -c 48 /dev/urandom | base64 > /tmp/backup.passphrase && chmod 600 /tmp/backup.passphrase
          mkdir -p /tmp/offsite
          k(){ head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          cat > .env.runtime <<ENV
          POSTGRES_PASSWORD=drillpassword123
          DOCKER_DATABASE_URL=postgres://elesend:drillpassword123@db:5432/elesend
          OTP_KEY=$(k)
          ADMIN_MFA_ENCRYPTION_KEY=$(k)
          JWT_SECRET=$(k)
          ADMIN_MASTER_KEY=$(k)
          AUDIT_LOG_SECRET=$(k)
          ELESEND_DOMAIN=drill.example.test
          ENV
          sed -i 's/^ *//' .env.runtime
      - name: Start the production database setup
        run: |
          docker compose -f deploy/runtime/compose.yaml --env-file .env.runtime up -d --wait db
          q(){ docker compose -f deploy/runtime/compose.yaml --env-file .env.runtime exec -T db psql -U elesend -d elesend -Atqc "$1"; }
          echo "SETTING archive_mode=$(q 'SHOW archive_mode') archive_timeout=$(q 'SHOW archive_timeout') max_connections=$(q 'SHOW max_connections') statement_timeout=$(q 'SHOW statement_timeout')"
          q "CREATE DATABASE elesend_test"
      - name: Migrate inside the database network, creating the API's limited login
        run: |
          db=$(docker compose -f deploy/runtime/compose.yaml --env-file .env.runtime ps -q db)
          docker run --rm --network container:$db -v "$PWD":/app -w /app -e DATABASE_URL=postgres://elesend:drillpassword123@127.0.0.1:5432/elesend -e ELESEND_APP_DB_PASSWORD=apppassword456 node:22 node scripts/migrate.mjs
      - name: The API works under its limited login
        run: |
          db=$(docker compose -f deploy/runtime/compose.yaml --env-file .env.runtime ps -q db)
          docker run --rm --network container:$db -v "$PWD":/app -w /app -e NODE_ENV=test -e APP_DATABASE_URL=postgres://elesend_app:apppassword456@127.0.0.1:5432/elesend -e OWNER_DATABASE_URL=postgres://elesend:drillpassword123@127.0.0.1:5432/elesend node:22 node scripts/ci/limited-login-check.mjs
      - name: Load test against the production settings
        run: |
          db=$(docker compose -f deploy/runtime/compose.yaml --env-file .env.runtime ps -q db)
          docker run --rm --network container:$db -v "$PWD":/app -w /app -e NODE_ENV=test -e TEST_DATABASE_URL=postgres://elesend:drillpassword123@127.0.0.1:5432/elesend_test node:22 node scripts/prelaunch-load.mjs > load.log 2>&1 || { tail -30 load.log; exit 1; }
          grep -E '^\{"simulatedRiders' load.log | sed 's/^/LOAD /'
          docker run --rm --network container:$db -v "$PWD":/app -w /app -e NODE_ENV=test -e TEST_DATABASE_URL=postgres://elesend:drillpassword123@127.0.0.1:5432/elesend_test node:22 node scripts/local-delivery-simulator.mjs | tr -d '\n' | sed 's/^/SIMULATION /'; echo
          docker stats --no-stream --format 'DBSTATS {{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}' $db
      - name: Disaster drill
        run: bash scripts/ci/resilience-drill.sh
