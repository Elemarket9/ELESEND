name: ELESEND checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: elesend
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: elesend_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U elesend -d elesend_test_ci'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://elesend:test-only-password@localhost:5432/elesend_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
