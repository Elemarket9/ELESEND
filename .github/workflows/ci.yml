name: ELESEND checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: elesend
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: elesend_test_ci
          PGUSER: elesend
          PGPASSWORD: test-only-password
          PGDATABASE: elesend_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U elesend -d elesend_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://elesend:test-only-password@localhost:5432/elesend_test_ci
      TEST_DATABASE_URL: postgres://elesend:test-only-password@localhost:5432/elesend_test_ci
      PGUSER: elesend
      PGPASSWORD: test-only-password
      PGDATABASE: elesend_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report mobile production dependency advisories (non-blocking)
        run: |
          npm audit --prefix apps/mobile --omit=dev --json > mobile-dependency-audit.json || true
          node scripts/ci/report-mobile-audit.mjs mobile-dependency-audit.json
      - name: Check for committed secrets
        run: node scripts/secret-scan.mjs
      - name: Run database migrations
        run: npm run migrate
      - name: Run backend, geospatial, security, and mobile logic tests
        run: npm test
      - name: Check load and resilience script syntax
        run: |
          node --check scripts/prelaunch-load.mjs
          node --check scripts/prelaunch-simulation.mjs
          node --check scripts/local-delivery-simulator.mjs
      - name: Report duplicated code windows (8 lines)
        run: node scripts/find-duplicates.mjs 8
      - name: Verify mobile modules syntax and release manifest security
        run: |
          node --check apps/mobile/src/config.js
          node --check apps/mobile/src/customer-location.js
          node --check apps/mobile/src/manual-address.js
          node --check apps/mobile/src/booking-contract.js
          node --check apps/mobile/src/maps/private-map-style.mjs
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the API image
        run: docker build -t elesend-api:ci .
      - name: Build the map tile image
        run: docker build -t elesend-maps:ci -f deploy/maps/Dockerfile .
      - name: The API image holds every module the server imports
        run: docker run --rm elesend-api:ci node --input-type=module -e "await import('/app/services/api/http.mjs');await import('/app/services/api/modules/maps/trace-review.mjs')"
