name: ELESEND checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: elesend
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: elesend_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://elesend:test-only-password@localhost:5432/elesend_test_ci
      TEST_DATABASE_URL: postgres://elesend:test-only-password@localhost:5432/elesend_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run database migrations
        run: npm run migrate
      - name: Run backend, geospatial, security, and mobile logic tests
        run: npm test
      - name: Verify mobile modules syntax and release manifest security
        run: |
          node --check apps/mobile/src/config.js
          node --check apps/mobile/src/customer-location.js
          node --check apps/mobile/src/manual-address.js
          node --check apps/mobile/src/booking-contract.js
          node --check apps/mobile/src/maps/private-map-style.mjs
