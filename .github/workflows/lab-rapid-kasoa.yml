# LAB ONLY (temporary, removed before merge): RAPID Courier to GTBank Kasoa through ELESEND with real OSM routing.
name: Lab RAPID Courier to Kasoa
on: {push: {branches: [lab/rapid-kasoa]}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env: {POSTGRES_PASSWORD: lab, POSTGRES_DB: elesend}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -yq osmium-tool
      - run: mkdir -p /tmp/map && sh scripts/download-ghana.sh /tmp/map
      - name: Find the places in OpenStreetMap
        run: |
          osmium tags-filter /tmp/map/ghana-latest.osm.pbf nwr/name nwr/brand nwr/operator -o /tmp/named.pbf
          osmium export /tmp/named.pbf -f geojsonseq -o /tmp/named.geojsonseq --geometry-types=point,linestring,polygon
          node scripts/lab/osm-find.mjs /tmp/named.geojsonseq /tmp/osm.json
      - run: sh scripts/prepare-ghana-osrm.sh /tmp/map
      - name: Start routing
        run: |
          docker run -d -p 5001:5000 -v /tmp/map:/data ghcr.io/project-osrm/osrm-backend:v26.4.0 osrm-routed --algorithm mld /data/ghana-latest.osrm
          docker run -d -p 5002:5000 -v /tmp/map:/data ghcr.io/project-osrm/osrm-backend:v26.4.0 osrm-routed --algorithm mld /data/ghana-motorcycle.osrm
          for i in $(seq 60); do curl -fs 'http://127.0.0.1:5001/route/v1/driving/-0.18,5.6;-0.19,5.61' >/dev/null && curl -fs 'http://127.0.0.1:5002/route/v1/driving/-0.18,5.6;-0.19,5.61' >/dev/null && break; sleep 2; done
      - name: Journey
        env: {TEST_DATABASE_URL: 'postgres://postgres:lab@127.0.0.1:5432/elesend', OSM_MATCHES: /tmp/osm.json, DATABASE_SSL: disable}
        run: node scripts/lab/rapid-kasoa.mjs
