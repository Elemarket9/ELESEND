# Daily map check. Servers update themselves every night (deploy/runtime/refresh-map.sh). This job rebuilds the same
# map from that day's Ghana OpenStreetMap data and runs config/map-quality.json against it, so a change in the data
# that would break search or routing shows up here as a failed run (GitHub emails the owner). Nothing is committed.
name: Map refresh
on:
  schedule: [{cron: '41 1 * * *'}]
  workflow_dispatch: {}
permissions: {contents: read}
concurrency: {group: map-refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -yq osmium-tool
      - name: Download Ghana OpenStreetMap extract
        run: mkdir -p /tmp/map && sh scripts/download-ghana.sh /tmp/map
      - name: Build searchable places
        run: |
          sh scripts/build-ghana-places.sh /tmp/map | tee /tmp/places-summary.json
          size=$(stat -c %s services/api/modules/maps/ghana-osm-places.json)
          echo "places file: $size bytes"
          # The wider place list for Greater Accra, Kumasi and Central is still a named-feature extract, not the planet file.
          # 120 MB leaves room for that list. A file past this is a filter bug, not expected growth.
          if [ "$size" -gt 120000000 ]; then echo '::error::Places file is over 120 MB; narrow the tag filter in scripts/build-ghana-places.sh'; exit 1; fi
          if [ "$size" -gt 80000000 ]; then echo '::warning::Places file is over 80 MB; check server memory before the nightly load'; fi
      - name: Build named roads
        run: sh scripts/build-ghana-roads.sh /tmp/map /tmp/map/ghana-osm-roads.json
      - name: Build road graphs
        run: sh scripts/prepare-ghana-osrm.sh /tmp/map
      - name: Start routing
        run: |
          docker run -d -p 5001:5000 -v /tmp/map:/data ghcr.io/project-osrm/osrm-backend:v26.4.0 osrm-routed --algorithm mld /data/ghana-latest.osrm
          docker run -d -p 5002:5000 -v /tmp/map:/data ghcr.io/project-osrm/osrm-backend:v26.4.0 osrm-routed --algorithm mld /data/ghana-motorcycle.osrm
          for i in $(seq 90); do curl -fs 'http://127.0.0.1:5001/route/v1/driving/-0.18,5.6;-0.19,5.61' >/dev/null && curl -fs 'http://127.0.0.1:5002/route/v1/driving/-0.18,5.6;-0.19,5.61' >/dev/null && break; sleep 2; done
      - name: Map quality checks (searches with the new places, routes on the new graphs)
        env: {ROUTING_OSRM_CAR_URL: 'http://127.0.0.1:5001', ROUTING_OSRM_MOTORCYCLE_URL: 'http://127.0.0.1:5002'}
        run: node scripts/map-quality.mjs --routes-required | tee /tmp/map-quality.txt
      - name: Test suite with the new places
        run: node --test tests/geocoder-search-regressions.test.mjs tests/map-quality.test.mjs tests/map-search-stored-places.test.mjs tests/map-place-overlay.test.mjs
      - name: Keep the built places for inspection
        uses: actions/upload-artifact@v4
        with: {name: ghana-osm-places, path: services/api/modules/maps/ghana-osm-places.json, retention-days: 7}
