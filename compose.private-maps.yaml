# Private Ghana tiles and OSRM overlay:
# docker compose -f compose.yaml -f compose.private-maps.yaml up -d
# Prepare the .osrm graphs first with scripts/prepare-ghana-osrm.ps1 or .sh.
services:
  api:
    environment:
      ROUTING_PROVIDER_PRIORITY: osrm
      ROUTING_OSRM_URL: http://osrm:5000
      ROUTING_OSRM_VEHICLES_JSON: '{"car":{"endpoint":"http://osrm:5000","profile":"driving"},"motorcycle":{"endpoint":"http://osrm-motorcycle:5000","profile":"driving"}}'
      GHANAPOSTGPS_LOOKUP_ENABLED: ${GHANAPOSTGPS_LOOKUP_ENABLED:-false}
      GHANAPOSTGPS_LOOKUP_URL: ${GHANAPOSTGPS_LOOKUP_URL:-https://ghanapostgps.sperixlabs.org}
    depends_on:
      osrm: {condition: service_started}
      osrm-motorcycle: {condition: service_started}
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0
    command: [osrm-routed, --algorithm, mld, --max-table-size, '100', /data/ghana-latest.osrm]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${GHANA_MAP_DATA:?Set GHANA_MAP_DATA to the prepared Ghana data directory}
        target: /data
        read_only: true
    networks: [private]
  osrm-motorcycle:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0
    command: [osrm-routed, --algorithm, mld, --max-table-size, '100', /data/ghana-motorcycle.osrm]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${GHANA_MAP_DATA:?Set GHANA_MAP_DATA to the prepared Ghana data directory}
        target: /data
        read_only: true
    networks: [private]
  maps:
    build:
      context: .
      dockerfile: deploy/maps/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${GHANA_MAP_DATA:?Set GHANA_MAP_DATA to the prepared Ghana data directory}
        target: /data
        read_only: true
    ports: ['127.0.0.1:3145:3145']
    networks: [private]
