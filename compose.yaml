services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: elesend
      POSTGRES_USER: elesend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U elesend -d elesend]
      interval: 5s
      retries: 20
  migrate:
    build: .
    command: [node, scripts/migrate.mjs]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set a dedicated ELESEND PostgreSQL URL using db as hostname}
      DATABASE_SSL: ${DATABASE_SSL:-auto}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
  api:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set database URL}
      DATABASE_SSL: ${DATABASE_SSL:-auto}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      OTP_KEY: ${OTP_KEY:?Set 64 hex characters}
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:?Set 64 hex characters}
      JWT_SECRET: ${JWT_SECRET:?Set 32+ character JWT secret}
      ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:?Set 32+ character admin master key}
      AUDIT_LOG_SECRET: ${AUDIT_LOG_SECRET:?Set 32+ character audit log secret}
      NODE_ENV: production
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      READINESS_PROBE_TOKEN: ${READINESS_PROBE_TOKEN:-}
      HOST: 0.0.0.0
      PORT: '3090'
      API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:?Set public API HTTPS origin}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?Set public web HTTPS origin}
      ADMIN_HOST: ${ADMIN_HOST:?Set admin hostname}
      ENABLE_PREPAID_CREDITS: ${ENABLE_PREPAID_CREDITS:-false}
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-}
      ROUTING_OSRM_MOTORCYCLE_URL: ${ROUTING_OSRM_MOTORCYCLE_URL:-}
      ROUTING_OSRM_CAR_URL: ${ROUTING_OSRM_CAR_URL:-}
      ROUTING_OSRM_VEHICLES_JSON: ${ROUTING_OSRM_VEHICLES_JSON:-}
      ROUTING_PROVIDER_PRIORITY: osrm
      ROUTING_OSRM_PROFILES_JSON: '${ROUTING_OSRM_PROFILES_JSON:-{"car":"driving","motorcycle":"driving"}}'
      ROUTING_ALLOW_SINGLE_ENDPOINT: ${ROUTING_ALLOW_SINGLE_ENDPOINT:-false}
      GHANAPOSTGPS_LOOKUP_ENABLED: ${GHANAPOSTGPS_LOOKUP_ENABLED:-false}
      GHANAPOSTGPS_LOOKUP_URL: ${GHANAPOSTGPS_LOOKUP_URL:-https://ghanapostgps.sperixlabs.org}
      NOTIFICATION_GATEWAY_ENDPOINT: ${NOTIFICATION_GATEWAY_ENDPOINT:-}
      NOTIFICATION_GATEWAY_ALLOWED_HOST: ${NOTIFICATION_GATEWAY_ALLOWED_HOST:-}
      NOTIFICATION_GATEWAY_TOKEN: ${NOTIFICATION_GATEWAY_TOKEN:-}
      PAYMENT_GATEWAY_NAME: ${PAYMENT_GATEWAY_NAME:-}
      PAYMENT_GATEWAY_ENDPOINT: ${PAYMENT_GATEWAY_ENDPOINT:-}
      PAYMENT_GATEWAY_ALLOWED_HOST: ${PAYMENT_GATEWAY_ALLOWED_HOST:-}
      PAYMENT_GATEWAY_TOKEN: ${PAYMENT_GATEWAY_TOKEN:-}
      PAYMENT_GATEWAY_CHECKOUT_HOSTS: ${PAYMENT_GATEWAY_CHECKOUT_HOSTS:-}
      PAYMENT_GATEWAY_METHODS: ${PAYMENT_GATEWAY_METHODS:-}
      PAYMENT_PAYER_FIELDS: ${PAYMENT_PAYER_FIELDS:-}
      FOOD_ACCEPTANCE_TIMEOUT_SECONDS: ${FOOD_ACCEPTANCE_TIMEOUT_SECONDS:-}
      FOOD_COURIER_TIMEOUT_SECONDS: ${FOOD_COURIER_TIMEOUT_SECONDS:-}
      FOOD_PAYMENT_TIMEOUT_SECONDS: ${FOOD_PAYMENT_TIMEOUT_SECONDS:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      SMS_PROVIDER: ${SMS_PROVIDER:-auto}
      SMS_GATEWAY_ENDPOINT: ${SMS_GATEWAY_ENDPOINT:-}
      SMS_GATEWAY_ALLOWED_HOST: ${SMS_GATEWAY_ALLOWED_HOST:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      HUBTEL_CLIENT_ID: ${HUBTEL_CLIENT_ID:-}
      HUBTEL_CLIENT_SECRET: ${HUBTEL_CLIENT_SECRET:-}
      HUBTEL_MERCHANT_ACCOUNT_NUMBER: ${HUBTEL_MERCHANT_ACCOUNT_NUMBER:-}
      HUBTEL_SENDER_ID: ${HUBTEL_SENDER_ID:-ELESEND}
      HUBTEL_SMS_ENDPOINT: ${HUBTEL_SMS_ENDPOINT:-https://api.hubtel.com/v1/messages/send}
      HUBTEL_PAYMENT_ALLOWED_HOST: ${HUBTEL_PAYMENT_ALLOWED_HOST:-payproxyapi.hubtel.com}
      HUBTEL_PAYMENT_ENDPOINT: ${HUBTEL_PAYMENT_ENDPOINT:-https://payproxyapi.hubtel.com}
      HUBTEL_ENABLED_METHODS: ${HUBTEL_ENABLED_METHODS:-MOMO,CARD,QR}
      HUBTEL_CALLBACK_BASE_URL: ${HUBTEL_CALLBACK_BASE_URL:-}
      HUBTEL_RETURN_BASE_URL: ${HUBTEL_RETURN_BASE_URL:-}
      HUBTEL_CANCELLATION_BASE_URL: ${HUBTEL_CANCELLATION_BASE_URL:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_ENABLED_METHODS: ${PAYSTACK_ENABLED_METHODS:-MOMO,CARD}
      SETTLEMENT_HUBTEL_RECEIVING_ACCOUNT: ${SETTLEMENT_HUBTEL_RECEIVING_ACCOUNT:-}
      SETTLEMENT_HUBTEL_PROVIDER_CHANNEL: ${SETTLEMENT_HUBTEL_PROVIDER_CHANNEL:-}
      SETTLEMENT_PAYSTACK_RECIPIENT_TYPE: ${SETTLEMENT_PAYSTACK_RECIPIENT_TYPE:-}
      SETTLEMENT_PAYSTACK_PROVIDER_CHANNEL: ${SETTLEMENT_PAYSTACK_PROVIDER_CHANNEL:-}
    ports: ["127.0.0.1:3090:3090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [private, egress]
networks:
  private: {internal: true}
  egress: {}
volumes:
  pgdata:
