# PostgreSQL 18 Production Configuration for ELESEND Runtime
# Optimized for high-throughput financial ledger transactions, spatial PostGIS queries, and low WAL churn.

# --- Memory Settings ---
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 256MB           # For fast index builds (GiST, GIN, B-tree)
work_mem = 16MB                        # Adequate for spatial KNN and trigram joins without disk spill
huge_pages = try

# --- Connection Settings ---
max_connections = 100                  # Node.js pool capped at 10-25 per instance
statement_timeout = 15000              # 15s max query execution safety
idle_in_transaction_session_timeout = 30000 # 30s abort for hung transactions

# --- Write Ahead Log (WAL) & Checkpoints ---
wal_buffers = 16MB                     # Standard for shared_buffers >= 1GB
min_wal_size = 1GB
max_wal_size = 4GB                     # Prevents checkpoint storms and unbounded disk growth
checkpoint_completion_target = 0.9     # Spread I/O writes smoothly across checkpoint interval
checkpoint_timeout = 15min             # Longer checkpoint reduces write volume on SSD storage

# --- Query Planner Cost Constants for SSD Storage ---
random_page_cost = 1.1                 # Fast random reads on SSD (vs 4.0 for spinning HDD)
seq_page_cost = 1.0
effective_io_concurrency = 200         # Concurrent asynchronous I/O channels
default_statistics_target = 100

# --- Financial Integrity & Durability ---
synchronous_commit = on                # Guarantee zero financial ledger loss on system crash
fsync = on
full_page_writes = on

# --- Logging & Diagnostics ---
log_destination = 'stderr'
logging_collector = off                # Container logs handle rotation via json-file driver
log_min_duration_statement = 250       # Log slow queries taking > 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
deadlock_timeout = 1s

# --- Autovacuum Tuning for High-Volume Tables ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.05  # Trigger vacuum after 5% rows changed (keeps tracking slim)
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000
